<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>✊ Rock Paper Scissors ✋</h1>

        <div class="choices">
            <button class="choice" data-choice="rock">🪨 Rock</button>
            <button class="choice" data-choice="paper">📄 Paper</button>
            <button class="choice" data-choice="scissors">✂️ Scissors</button>
        </div>

        <div class="result-box">
            <p><strong>You:</strong> <span id="player-choice">-</span></p>
            <p><strong>Computer:</strong> <span id="computer-choice">-</span></p>

            <h2 id="result">Choose your move!</h2>
        </div>

        <div class="scoreboard">
            <div>
                <h3>You</h3>
                <p id="player-score">0</p>
            </div>

            <div>
                <h3>Computer</h3>
                <p id="computer-score">0</p>
            </div>

            <div>
                <h3>Draw</h3>
                <p id="draw-score">0</p>
            </div>
        </div>

        <button id="reset" type="button">Reset Game</button>

    </div>

<script src="script.js"></script>

</body>
</html>
